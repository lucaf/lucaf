<style>
.n{font-family:&apos;SF Mono&apos;,SFMono-Regular,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Liberation Mono&apos;,monospace;font-size:34px;font-weight:600;letter-spacing:-.5px;fill:#1a7f37}
