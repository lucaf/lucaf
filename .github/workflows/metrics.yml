name: Metrics

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lucaf
          filename: metrics.calendar.svg
          committer_branch: metrics
          base: ""
          config_timezone: Europe/Paris
          extras_css: |
            h2, h3 { color: #57606a }
            @media (prefers-color-scheme: dark) {
              [fill="#ebedf0"] { fill: #21262d }
              svg { color: #8b949e }
              h2, h3 { color: #adbac7 }
            }
          plugins_errors_fatal: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  breakdown:
    runs-on: ubuntu-latest
    needs: metrics          # both jobs push to `metrics`; serialise to avoid a race
    steps:
      - uses: actions/checkout@v4

      - name: Render contribution breakdown
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/contributions.py lucaf > /tmp/contributions.svg

      - name: Render GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/github_stats.py lucaf > /tmp/github-stats.svg

      - name: Publish to metrics branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics
          git checkout -B metrics origin/metrics
          cp /tmp/contributions.svg contributions.svg
          cp /tmp/github-stats.svg  github-stats.svg
          git add contributions.svg github-stats.svg
          git diff --staged --quiet || git commit -m "Update generated charts [skip ci]"
          git push origin metrics
