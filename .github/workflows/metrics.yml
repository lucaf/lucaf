name: Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check token is present
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::METRICS_TOKEN is EMPTY or not set on this repository"
            exit 1
          fi
          echo "::notice::METRICS_TOKEN present - ${#TOKEN} chars, prefix ${TOKEN:0:4}"
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lucaf
          filename: metrics.calendar.svg
          base: ""
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lucaf
          filename: metrics.activity.svg
          base: ""
          config_timezone: Europe/Paris
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_visibility: public
          plugin_activity_filter: push, pull_request, issue, release
